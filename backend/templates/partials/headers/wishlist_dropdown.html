{% if header_wishlist_products %}
<div class="dropdown-item-list">
    {% for product in header_wishlist_products %}
    <div class="dropdown-item-row position-relative">
        {% if product.image %}
        <img src="{{ product.image.url }}" class="dropdown-item-img" alt="{{ product.name }}">
        {% else %}
        <div class="dropdown-item-img bg-light"></div>
        {% endif %}
        <div class="dropdown-item-info pe-4">
            <h6><a href="{% url 'product_detail' product.id %}" class="text-decoration-none text-dark">{{ product.name }}</a></h6>
            <div class="dropdown-item-price">৳{{ product.price }}</div>
        </div>
        <button type="button" class="btn btn-sm btn-link text-danger position-absolute end-0 top-50 translate-middle-y ajax-remove-wishlist" data-product-id="{{ product.id }}" title="Remove item" style="padding: 0 5px;">
            <i class="fas fa-trash"></i>
        </button>
    </div>
    {% endfor %}
</div>
<div class="mt-3 text-center">
    <a href="{% url 'wishlist' %}" class="btn btn-primary w-100 btn-sm">View Wishlist</a>
</div>
{% else %}
<div class="text-center py-3 text-muted">Your wishlist is empty.</div>
{% endif %}
